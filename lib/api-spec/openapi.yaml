openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /app/guidance:
    post:
      operationId: generateMetodGuidance
      description: Public original MetodManiak rule engine with server-fetched weather. No account or trial required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetodGuidanceInput" }
      responses:
        "200":
          description: Original recommendations for weather, gear, feed, spot, rig and competition strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MethodGuidance" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "503":
          description: Weather unavailable; no invented substitute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryError" }
  /app/events:
    get:
      operationId: listFishingEvents
      responses:
        "200":
          description: Calendar events ordered by calendar date and start time
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FishingEvent" } }
    post:
      operationId: createFishingEvent
      description: Administrator only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FishingEventInput" }
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FishingEvent" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
  /app/events/import:
    post:
      operationId: importFishingEvents
      description: Administrator only. Atomic append; repeated name/date/time/location entries are skipped, never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FishingEventsImportInput" }
      responses:
        "201":
          description: Import saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FishingEventsImportResult" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
  /app/events/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateFishingEvent
      description: Administrator only. Version must match the current record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FishingEventUpdate" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FishingEvent" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "404": { $ref: "#/components/responses/DirectoryMissing" }
        "409": { $ref: "#/components/responses/DirectoryConflict" }
    delete:
      operationId: deleteFishingEvent
      description: Administrator only. Version protects an entry changed after opening the confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryDeleteInput" }
      responses:
        "204": { description: Deleted event }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "404": { $ref: "#/components/responses/DirectoryMissing" }
        "409": { $ref: "#/components/responses/DirectoryConflict" }
  /app/fisheries:
    get:
      operationId: listAppFisheries
      responses:
        "200":
          description: Fisheries ordered alphabetically
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppFishery" } }
    post:
      operationId: createAppFishery
      description: Administrator only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppFisheryInput" }
      responses:
        "201":
          description: Created fishery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppFishery" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
  /app/fisheries/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: updateAppFishery
      description: Administrator only. Version must match the current record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppFisheryUpdate" }
      responses:
        "200":
          description: Updated fishery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppFishery" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "404": { $ref: "#/components/responses/DirectoryMissing" }
        "409": { $ref: "#/components/responses/DirectoryConflict" }
    delete:
      operationId: deleteAppFishery
      description: Administrator only. Version protects against deleting a changed entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryDeleteInput" }
      responses:
        "204": { description: Deleted fishery }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "404": { $ref: "#/components/responses/DirectoryMissing" }
        "409": { $ref: "#/components/responses/DirectoryConflict" }
  /app-access:
    get:
      operationId: getAppAccess
      summary: Seven-day app trial based on the authenticated account registration
      responses:
        "200":
          description: Current account trial status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccess" }
        "503":
          description: Account verification temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccessError" }
  /weather/places:
    get:
      operationId: searchWeatherPlaces
      parameters:
        - { in: query, name: name, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Matching localities
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WeatherPlace" } }
        "400":
          description: Invalid search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherError" }
        "503":
          description: Weather provider unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherError" }
  /weather:
    get:
      operationId: getFishingWeather
      parameters:
        - { in: query, name: latitude, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { in: query, name: longitude, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Current weather and five local days with fishing guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FishingWeather" }
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherError" }
        "503":
          description: Weather provider unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherError" }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /product-colors:
    get:
      operationId: listProductColors
      description: Distinct non-blank catalogue colors, optionally scoped to a category. Independent of size, search and availability filters.
      parameters:
        - { in: query, name: category, schema: { type: string } }
      responses:
        "200":
          description: Catalogue colors sorted alphabetically
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400":
          description: Invalid filters
  /products:
    get:
      operationId: listProducts
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: subcategory, schema: { type: string } }
        - { in: query, name: color, description: Exact catalogue color, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: featured, schema: { type: boolean } }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /admin/stock-history:
    get:
      operationId: listStockHistory
      description: Administrator-only stock changes, newest first. All filters combine with AND and persist across cursor pages. Product and author IDs match exactly against saved audit snapshots, including deleted products. Dates are inclusive calendar days in Europe/Warsaw; dateFrom must not exceed dateTo. Preview changes use the shared anonymous preview-admin label, never a session identifier.
      parameters:
        - { in: query, name: before, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: productId, description: Exact saved product ID, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { in: query, name: actorId, description: Exact account ID or preview-admin, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { in: query, name: dateFrom, description: First included day in Europe/Warsaw, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
        - { in: query, name: dateTo, description: Last included day in Europe/Warsaw, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
      responses:
        "200":
          description: Stock history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistoryPage" }
        "400": { description: "Invalid pagination, filter or calendar date range" }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
  /admin/stock-history/export:
    get:
      operationId: exportStockHistory
      description: Administrator-only CSV of ALL matching stock changes, newest first, without pagination. Uses saved snapshots including deleted products. Filters combine with AND; dates include whole days in Europe/Warsaw. UTF-8 with BOM, comma delimiter, CRLF records, quoted cells and formula-safe text. Response is never cached.
      parameters:
        - { in: query, name: productId, description: Exact saved product ID, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { in: query, name: actorId, description: Exact account ID or preview-admin, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { in: query, name: dateFrom, description: First included day in Europe/Warsaw, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
        - { in: query, name: dateTo, description: Last included day in Europe/Warsaw, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' } }
      responses:
        "200":
          description: CSV attachment, with a header row even if no changes match. Timestamps are ISO 8601 UTC.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "400": { description: "Invalid filter or calendar date range; pagination parameters are not accepted" }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
  /products/color-photo:
    patch:
      operationId: replaceWaftersColorPhoto
      description: Administrator-only atomic photo replacement for one exact wafters color in 6, 8 and 10 mm. Requires the confirmed media snapshot and a published image uploaded by this administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaftersColorPhotoInput" }
      responses:
        "200":
          description: Updated products
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
        "400": { description: Invalid image or selection }
        "401": { description: Authentication required }
        "403": { description: Administrator or upload ownership required }
        "409": { description: Product selection or media changed; nothing saved }
  /products/stock:
    patch:
      operationId: updateProductStocks
      description: Administrator-only atomic stock replacement. Rejects duplicate IDs, missing products and stocks changed since the summary was prepared. No other product fields are modified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductStocksUpdate" }
      responses:
        "200":
          description: All updated products
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
        "400":
          description: Invalid batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockUpdateError" }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
        "404":
          description: At least one product is missing; nothing saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockUpdateError" }
        "409":
          description: Stock changed since selected; nothing saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockUpdateError" }
        "500":
          description: Save failed; transaction rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockUpdateError" }
  /products/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getProduct
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    put:
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      responses:
        "204": { description: Deleted }
  /videos:
    get:
      operationId: listVideos
      responses:
        "200":
          description: Videos latest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Video" }
    post:
      operationId: createVideo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "409":
          description: Episode already has a linked video
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
  /videos/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    put:
      operationId: updateVideo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "409":
          description: Episode already has a linked video
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
    delete:
      operationId: deleteVideo
      responses:
        "204": { description: Deleted }
  /recommendations:
    post:
      operationId: recommendBaits
      description: Public bait recommendations, without account or trial requirements.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationInput" }
      responses:
        "200":
          description: Rule-based recommendations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
  /cart/quote:
    post:
      operationId: quoteCart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartInput" }
      responses:
        "200":
          description: Server calculated totals and stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartQuote" }
  /payment-methods:
    get:
      operationId: getPaymentMethods
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
  /checkout:
    post:
      operationId: startCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Payment redirect only once provider configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "503": { description: Payment provider not configured }
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Admin access state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/preview-session:
    post:
      operationId: createPreviewAdminSession
      responses:
        "200":
          description: Explicit one-hour development-only administrator session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "403": { description: Disabled outside development preview or cross-origin request }
    delete:
      operationId: deletePreviewAdminSession
      responses:
        "204": { description: Development administrator session revoked }
        "403": { description: Disabled outside development preview or cross-origin request }
  /site/page-view:
    post:
      operationId: recordSitePageView
      description: Anonymous daily page counter. No identity, cookies, IP, referrer or query string is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SitePageViewInput" }
      responses:
        "204": { description: Counted }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "429": { description: Rate limit }
  /admin/customers:
    get:
      operationId: listAdminCustomers
      description: Administrator only. Current registration-account data from Clerk, never credentials or arbitrary metadata.
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 160 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Accounts and linked order totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerPage" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "503":
          description: Account directory unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryError" }
  /admin/customer:
    get:
      operationId: getAdminCustomer
      parameters:
        - { in: query, name: id, required: true, schema: { type: string, maxLength: 100, pattern: '^user_[A-Za-z0-9]+$' } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Account and explicitly linked real orders, paginated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerDetail" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "404": { $ref: "#/components/responses/DirectoryMissing" }
        "503":
          description: Account directory unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryError" }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      description: Administrator only. Real orders excluding demonstrations; Europe/Warsaw calendar days. Order values are not payment revenue.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { in: query, name: to, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Aggregated dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/DirectoryUnauthorized" }
        "403": { $ref: "#/components/responses/DirectoryUnauthorized" }
  /admin/summary:
    get:
      operationId: getAdminSummary
      responses:
        "200":
          description: Inventory summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
  /admin/orders:
    get:
      operationId: listAdminOrders
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [accepted, processing, shipped] }
      responses:
        "200":
          description: Orders visible only to administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminOrder" } }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
    post:
      operationId: createAdminOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrderInput" }
      responses:
        "201":
          description: Manually registered order; does not charge payments or change stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "400": { description: Invalid order }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrderUpdate" }
      responses:
        "200":
          description: Updated status and tracking number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "400": { description: Invalid status or tracking }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
        "404": { description: Order not found }
        "409": { description: Order changed since opened; refresh before saving }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
  /storage/uploads/publish:
    post:
      operationId: publishUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishInput" }
      responses:
        "200":
          description: Public serving URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    DirectoryInvalid:
      description: Invalid fields
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DirectoryError" }
    DirectoryUnauthorized:
      description: An authenticated administrator is required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DirectoryError" }
    DirectoryMissing:
      description: Entry no longer exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DirectoryError" }
